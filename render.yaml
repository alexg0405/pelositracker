# Render blueprint. The Docker image builds the Rust engine and runs uvicorn.
# Sleeping instances pause live feeds. Hosted research/trading evidence is
# durable only when DATABASE_URL points to PostgreSQL. SQLite remains the
# workstation fallback and must not be treated as persistent on a free web
# instance.
services:
  - type: web
    name: live-edge-monitor
    runtime: docker
    plan: free
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Two-person hosted use: set to "anthony:<password>,alex:<password>" in
      # the Render dashboard (never in this file) so each person has their own
      # login. Set ADMIN_USERNAME=anthony so research import/export stays with
      # the site operator.
      - key: AUTHORIZED_USERS
        sync: false
      - key: THE_ODDS_API_KEY   # optional; public Polymarket feeds need no key
        sync: false
      - key: ODDS_POLL_SECONDS
        value: "45"
      - key: APP_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      # Every store shares this bounded process-wide PostgreSQL pool. Keeping
      # it at two leaves room for Render's old/new process overlap under small
      # Supabase session-pool limits.
      - key: POSTGRES_POOL_MAX_CONNECTIONS
        value: "2"
      - key: WORKSTATION_MODE
        value: "false"
      - key: ENABLE_PAPER_BOTS
        value: "true"
      # The execution service still starts with automation off, dry-run mode,
      # and a closed live-order latch. API credentials remain private Render
      # variables and are never supplied by this blueprint.
      - key: ENABLE_POLYMARKET_US_TRADING
        value: "true"
      - key: POLYMARKET_US_KEY_ID
        sync: false
      - key: POLYMARKET_US_SECRET_KEY
        sync: false
      # Second live lane so Alex trades his own Polymarket account beside
      # Anthony's. Each lane keeps its own policy, book, journal, and arming
      # latch; hosted storage separates them by PostgreSQL schema.
      - key: ENABLE_POLYMARKET_US_ALEX_LANE
        value: "true"
      # Bind each live lane to one login: only that person can save policy,
      # arm, sell, or install the lane's API key. Anyone can still stop or
      # disarm any lane. Keys are usually pasted per-session from the
      # dashboard; the env pair below is the optional persistent fallback.
      - key: POLYMARKET_US_LANE_OWNERS
        value: "live:anthony,alex:alex"
      - key: POLYMARKET_US_ALEX_KEY_ID
        sync: false
      - key: POLYMARKET_US_ALEX_SECRET_KEY
        sync: false
      # Used only if DATABASE_URL is missing. The dashboard marks this fallback
      # as non-durable on hosted instances.
      - key: POLYMARKET_US_TRADING_DB
        value: /app/data/polymarket-us-trading.db
      - key: MAX_DATA_AGE_SECONDS
        value: "120"
      # Keep global floors neutral so custom bots apply their own thresholds.
      - key: SIGNAL_CONFIDENCE_THRESHOLD
        value: "0"
      - key: SIGNAL_EDGE_THRESHOLD
        value: "0"
      # Fake-money research only: permit WATCH signals held back solely by the
      # missing calibration artifact. Every identity, source, freshness, edge,
      # quality, depth, fee, and exposure gate still fails closed.
      - key: PAPER_ALLOW_UNCALIBRATED
        value: "true"
      - key: ODDS_PLAYER_MARKETS  # e.g. player_points,player_rebounds (per sport)
        sync: false
      - key: DATABASE_URL       # required for durable hosted evidence
        sync: false
      # - key: LEDGER_DB
      #   value: /var/data/ledger.db
      # - key: HISTORY_DB
      #   value: /var/data/history.db
      # - key: STATE_DB          # optional; otherwise monitor state uses LEDGER_DB
      #   value: /var/data/state.db
